[package]
name = "sim"
version.workspace = true
edition.workspace = true

[dependencies]
firmware = { path = "../firmware" }
ground = { path = "../ground" }

[features]
# Témoin sans protections : active `firmware/unprotected` (vote, ECC, rafraîchissement, FDIR neutralisés).
# À compiler dans un répertoire cible séparé : `--target-dir target/unprotected`.
unprotected = ["firmware/unprotected"]
